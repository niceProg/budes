  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

aside data-screen-label=\"Sidebar Koperasi\" style=\"width:228px;flex-shrink:0;background:#FFFDFB;border-right:1px solid #EBDDD3;position:sticky;top:0;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:20px 14px;z-index:40\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:2px 8px 18px\">\n      <div style=\"width:34px;height:34px;border-radius:9px;background:#A93438;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0\">BD<\u002Fdiv>\n      <div>\n        <div style=\"color:#2B1A17;font-weight:800;font-size:15px;line-height:1.1\">Bursa Desa<\u002Fdiv>\n        <div style=\"color:#9C8378;font-size:9.5px;font-weight:700;letter-spacing:0.05em\">PANEL KOPERASI<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ goDash }}\" style=\"display:flex;align-items:center;gap:10px;background:{{ sbDashBg }};border:none;border-radius:10px;padding:11px 12px;color:{{ sbDashFg }};font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left\" style-hover=\"background:#F7EFE7\">Dashboard<\u002Fbutton>\n    <button onclick=\"{{ goPasar }}\" style=\"display:flex;align-items:center;gap:10px;background:{{ sbPasarBg }};border:none;border-radius:10px;padding:11px 12px;color:{{ sbPasarFg }};font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left\" style-hover=\"background:#F7EFE7\">Jelajah Pasar<\u002Fbutton>\n    <button onclick=\"{{ goEtalase }}\" style=\"display:flex;align-items:center;gap:10px;background:{{ sbEtalaseBg }};border:none;border-radius:10px;padding:11px 12px;color:{{ sbEtalaseFg }};font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-align:left\" style-hover=\"background:#F7EFE7\">Etalase<\u002Fbutton>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"border-top:1px solid #EBDDD3;margin-top:14px;padding-top:14px;display:flex;align-items:center;gap:9px\">\n      <div style=\"width:30px;height:30px;border-radius:50%;background:#A93438;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ userInitial }}<\u002Fdiv>\n      <div style=\"min-width:0\">\n        <div style=\"color:#2B1A17;font-size:12.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ userName }}<\u002Fdiv>\n        <div style=\"color:#9C8378;font-size:10px;font-weight:600\">{{ userRoleLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ doLogout }}\" style=\"margin-top:10px;background:none;border:1.5px solid #E4D5CB;color:#7C6560;border-radius:9px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#F7EFE7\">Keluar<\u002Fbutton>\n  <\u002Faside>\n  <\u002Fsc-if>\n\n  <main style=\"flex:1;min-width:0\">\n\n    <sc-if value=\"{{ scrPasar }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Jelajah Pasar\">\n        <sc-if value=\"{{ heroOn }}\" hint-placeholder-val=\"{{ true }}\">\n          <section style=\"background:#F7EFE7;color:#2B1A17;border-bottom:1px solid #EBDDD3\">\n            <div style=\"max-width:1180px;margin:0 auto;padding:46px 20px 50px\">\n              <div style=\"display:inline-block;background:#fff;border:1px solid #E4D5CB;color:#8E2A2F;border-radius:999px;padding:4px 13px;font-size:11.5px;font-weight:700;letter-spacing:0.05em;margin-bottom:14px\">PASAR GOTONG ROYONG DESA<\u002Fdiv>\n              <h1 style=\"margin:0 0 10px;font-size:clamp(26px,4.5vw,36px);line-height:1.15;font-weight:800;max-width:640px;text-wrap:pretty\">Dari desa, untuk meja makan Indonesia<\u002Fh1>\n              <p style=\"margin:0 0 24px;font-size:15.5px;line-height:1.6;color:#7C6560;max-width:560px\">Pembeli memposting kebutuhan, warga menyanggupi dari hasil panen, dan koperasi desa menjadi penghubungnya. Silakan lihat-lihat dulu — daftar hanya saat ingin bertransaksi.<\u002Fp>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                <button onclick=\"{{ ctaBuat }}\" style=\"background:#A93438;color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit\" style-hover=\"background:#8E2A2F\">+ Buat Permintaan<\u002Fbutton>\n                <button onclick=\"{{ goEtalase }}\" style=\"background:#fff;color:#5C4A44;border:1.5px solid #E4D5CB;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#FBF7F2\">Lihat Etalase<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-if>\n\n        <div style=\"max-width:1180px;margin:0 auto;padding:28px 20px 64px\">\n          <div style=\"display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px\">\n            <div>\n              <h2 style=\"margin:0 0 4px;font-size:22px;font-weight:800\">Permintaan Pembeli<\u002Fh2>\n              <p style=\"margin:0;font-size:13.5px;color:#7C6560\">Kebutuhan yang bisa disanggupi warga lewat koperasi desa.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <sc-if value=\"{{ c.active }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button onclick=\"{{ c.pick }}\" style=\"background:#5C4A44;color:#fff;border:1.5px solid #5C4A44;border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ c.inactive }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button onclick=\"{{ c.pick }}\" style=\"background:#fff;color:#7C6560;border:1.5px solid #E4D5CB;border-radius:999px;padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#A93438;color:#A93438\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ varSorotOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div onclick=\"{{ sorot.open }}\" style=\"background:#fff;border:1px solid #EBDDD3;border-left:5px solid #A93438;border-radius:16px;padding:26px;margin-bottom:18px;cursor:pointer;display:flex;flex-wrap:wrap;gap:24px;align-items:center\" style-hover=\"box-shadow:0 10px 26px rgba(80,10,12,0.10)\">\n              <div style=\"flex:1.6;min-width:260px\">\n                <div style=\"font-size:11px;font-weight:800;letter-spacing:0.06em;color:#A93438;margin-bottom:8px\">PERMINTAAN SOROTAN<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px\">\n                  <div style=\"font-size:24px;font-weight:800;line-height:1.2\">{{ sorot.item_name }}<\u002Fdiv>\n                  <span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:{{ sorot.bBg }};color:{{ sorot.bFg }}\">{{ sorot.bLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:14px;color:#7C6560;margin-bottom:14px\">{{ sorot.qtyLine }} · tenggat {{ sorot.tglTxt }} ({{ sorot.hariTxt }})<\u002Fdiv>\n                <div style=\"display:flex;gap:22px;flex-wrap:wrap\">\n                  <div>\n                    <div style=\"font-size:11px;color:#9C8378;font-weight:600\">Harga target<\u002Fdiv>\n                    <div style=\"font-size:19px;font-weight:800;color:#A93438\">{{ sorot.hargaTxt }}<span style=\"font-size:12px;font-weight:600;color:#9C8378\"> /{{ sorot.satuan }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:11px;color:#9C8378;font-weight:600\">Nilai total<\u002Fdiv>\n                    <div style=\"font-size:19px;font-weight:800\">{{ sorot.totalTxt }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:220px\">\n                <div style=\"display:flex;justify-content:space-between;font-size:12.5px;color:#7C6560;margin-bottom:6px\"><span style=\"font-weight:700;color:#2B1A17\">{{ sorot.pct }}% tersanggupi<\u002Fspan><span>{{ sorot.hariTxt }}<\u002Fspan><\u002Fdiv>\n                <div style=\"height:12px;border-radius:99px;background:#F0E4DC;overflow:hidden;margin-bottom:16px\">\n                  <div style=\"height:100%;border-radius:99px;background:#1D7A46;width:{{ sorot.pct }}%\"><\u002Fdiv>\n                <\u002Fdiv>\n                <button onclick=\"{{ sorot.open }}\" style=\"width:100%;background:#A93438;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit\" style-hover=\"background:#8E2A2F\">Lihat &amp; Sanggupi<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ varGrid }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px\">\n              <sc-for list=\"{{ gridList }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <div onclick=\"{{ d.open }}\" style=\"background:#fff;border:1px solid #EBDDD3;border-radius:14px;padding:18px;cursor:pointer;transition:box-shadow .15s, transform .15s\" style-hover=\"box-shadow:0 8px 22px rgba(80,10,12,0.10);transform:translateY(-2px)\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px\">\n                    <div style=\"font-size:16.5px;font-weight:800;line-height:1.25\">{{ d.item_name }}<\u002Fdiv>\n                    <span style=\"flex-shrink:0;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:{{ d.bBg }};color:{{ d.bFg }}\">{{ d.bLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13px;color:#7C6560;margin-bottom:8px\">{{ d.qtyLine }}<\u002Fdiv>\n                  <div style=\"height:8px;border-radius:99px;background:#F0E4DC;overflow:hidden;margin-bottom:6px\">\n                    <div style=\"height:100%;border-radius:99px;background:#1D7A46;width:{{ d.pct }}%\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#7C6560;margin-bottom:12px\"><span>{{ d.pct }}% tersanggupi<\u002Fspan><span>{{ d.hariTxt }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #EBDDD3;padding-top:12px\">\n                    <div>\n                      <div style=\"font-size:11px;color:#9C8378;font-weight:600\">Harga target<\u002Fdiv>\n                      <div style=\"font-size:15px;font-weight:800;color:#A93438\">{{ d.hargaTxt }}<span style=\"font-size:11.5px;font-weight:600;color:#9C8378\"> /{{ d.satuan }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ d.dpPaid }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"font-size:11px;font-weight:700;color:#1D7A46;border:1px solid #BBDCC8;background:#F0F9F3;border-radius:999px;padding:3px 9px\">✓ DP Terbayar<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ varDaftar }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ pasarList }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <div onclick=\"{{ d.open }}\" style=\"background:#fff;border:1px solid #EBDDD3;border-radius:13px;padding:16px 20px;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px\" style-hover=\"box-shadow:0 6px 18px rgba(80,10,12,0.09);border-color:#DCC5BB\">\n                  <div style=\"flex:1.5;min-width:190px\">\n                    <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px\">\n                      <span style=\"font-size:15.5px;font-weight:800\">{{ d.item_name }}<\u002Fspan>\n                      <span style=\"font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:{{ d.bBg }};color:{{ d.bFg }}\">{{ d.bLabel }}<\u002Fspan>\n                      <sc-if value=\"{{ d.dpPaid }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10.5px;font-weight:700;color:#1D7A46\">✓ DP<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:#7C6560\">{{ d.qtyLine }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1.2;min-width:160px\">\n                    <div style=\"height:7px;border-radius:99px;background:#F0E4DC;overflow:hidden;margin-bottom:4px\">\n                      <div style=\"height:100%;border-radius:99px;background:#1D7A46;width:{{ d.pct }}%\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#7C6560\">{{ d.pct }}% tersanggupi<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"min-width:110px\">\n                    <div style=\"font-size:14.5px;font-weight:800;color:#A93438\">{{ d.hargaTxt }}<span style=\"font-size:11px;font-weight:600;color:#9C8378\"> /{{ d.satuan }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#7C6560\">{{ d.hariTxt }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"color:#C9AFA3;font-size:18px;font-weight:700\">›<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ pasarEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1.5px dashed #E4D5CB;border-radius:16px;padding:48px 24px;text-align:center\">\n              <div style=\"font-size:17px;font-weight:800;margin-bottom:6px\">Belum ada permintaan pada filter ini<\u002Fdiv>\n              <p style=\"margin:0 0 18px;font-size:13.5px;color:#7C6560\">Jadilah pembeli pertama yang memposting kebutuhan komoditas desa.<\u002Fp>\n              <button onclick=\"{{ ctaBuat }}\" style=\"background:#A93438;color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#8E2A2F\">+ Buat Permintaan<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ scrDemand }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Detail Permintaan\" style=\"max-width:1180px;margin:0 auto;padding:22px 20px 64px\">\n        <button onclick=\"{{ goPasar }}\" style=\"background:none;border:none;cursor:pointer;font-family:inherit;color:#A93438;font-size:13.5px;font-weight:700;padding:0;margin-bottom:16px\" style-hover=\"text-decoration:underline\">← Jelajah Pasar<\u002Fbutton>\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n          <div style=\"flex:1.7;min-width:300px;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:26px\">\n              <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px\">\n                <h1 style=\"margin:0;font-size:26px;font-weight:800;line-height:1.2\">{{ det.item_name }}<\u002Fh1>\n                <span style=\"font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:{{ det.bBg }};color:{{ det.bFg }}\">{{ det.bLabel }}<\u002Fspan>\n                <sc-if value=\"{{ det.dpPaid }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:11.5px;font-weight:700;color:#1D7A46;border:1px solid #BBDCC8;background:#F0F9F3;border-radius:999px;padding:4px 11px\">✓ DP Terbayar<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;color:#7C6560;margin-bottom:16px\">{{ det.qtyLine }} · tenggat {{ det.tglTxt }} ({{ det.hariTxt }})<\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px\"><span style=\"font-weight:800;color:#1D7A46\">{{ det.pct }}% tersanggupi<\u002Fspan><span style=\"color:#7C6560\">sisa {{ det.sisaKuotaTxt }}<\u002Fspan><\u002Fdiv>\n              <div style=\"height:12px;border-radius:99px;background:#F0E4DC;overflow:hidden\">\n                <div style=\"height:100%;border-radius:99px;background:#1D7A46;width:{{ det.pct }}%\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:26px\">\n              <h3 style=\"margin:0 0 14px;font-size:16px;font-weight:800\">Penyanggup ({{ det.pledgeCount }})<\u002Fh3>\n              <sc-if value=\"{{ detHasPledges }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <sc-for list=\"{{ detPledges }}\" as=\"p\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;align-items:center;gap:12px;border:1px solid #F0E4DC;border-radius:12px;padding:11px 14px\">\n                      <div style=\"width:34px;height:34px;border-radius:50%;background:#F6E3E1;color:#8E2A2F;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0\">{{ p.initial }}<\u002Fdiv>\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"font-size:13.5px;font-weight:700\">{{ p.warga_name }}<\u002Fdiv>\n                        <div style=\"font-size:12px;color:#7C6560\">{{ p.line }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:{{ p.bBg }};color:{{ p.bFg }};flex-shrink:0\">{{ p.bLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ detNoPledges }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:0;font-size:13.5px;color:#7C6560\">Belum ada penyanggup. Jadilah yang pertama bergotong royong memenuhi kebutuhan ini.<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1;min-width:280px;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:24px\">\n              <h3 style=\"margin:0 0 14px;font-size:15px;font-weight:800\">Rincian Pembayaran<\u002Fh3>\n              <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #EBDDD3\"><span style=\"color:#7C6560\">Nilai total<\u002Fspan><span style=\"font-weight:700\">{{ det.totalTxt }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #EBDDD3\"><span style=\"color:#7C6560\">Uang muka (30%)<\u002Fspan><span style=\"font-weight:800;color:#A93438\">{{ det.dpTxt }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #EBDDD3\"><span style=\"color:#7C6560\">Sisa pembayaran<\u002Fspan><span style=\"font-weight:700\">{{ det.sisaTxt }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0\"><span style=\"color:#7C6560\">Status DP<\u002Fspan><span style=\"font-weight:700\">{{ det.dpStatusLabel }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:24px\">\n              <h3 style=\"margin:0 0 6px;font-size:16px;font-weight:800\">Punya hasil panen ini?<\u002Fh3>\n              <p style=\"margin:0 0 16px;font-size:13px;color:#7C6560;line-height:1.55\">Sanggupi sebagian atau seluruhnya — sisa kebutuhan {{ det.sisaKuotaTxt }}.<\u002Fp>\n              <button onclick=\"{{ ctaPledge }}\" style=\"width:100%;background:#A93438;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit\" style-hover=\"background:#8E2A2F\">Sanggupi Permintaan<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:24px\">\n              <h3 style=\"margin:0 0 12px;font-size:15px;font-weight:800\">Koperasi berpotensi memenuhi<\u002Fh3>\n              <sc-if value=\"{{ detHasKandidat }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ detKandidat }}\" as=\"k\" hint-placeholder-count=\"2\">\n                    <div style=\"border:1px solid #F0E4DC;border-radius:11px;padding:10px 13px\">\n                      <div style=\"font-size:13px;font-weight:700\">{{ k.name }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#7C6560\">{{ k.note }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ detNoKandidat }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:0 0 1 font-weight:700;color:#5C4A44;margin-bottom:6px\">Jumlah<\u002Flabel>\n                  <input type=\"number\" placeholder=\"500\" value=\"{{ buat.qty }}\" onchange=\"{{ fBuatQty }}\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid #E4D5CB;border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:#2B1A17\">\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:110px\">\n                  <label style=\"display:block;font-size:12.5px;font-weight:700;color:#5C4A44;margin-bottom:6px\">Satuan<\u002Flabel>\n                  <input type=\"text\" placeholder=\"kg\" value=\"{{ buat.satuan }}\" onchange=\"{{ fBuatSatuan }}\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid #E4D5CB;border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:#2B1A17\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap\">\n                <div style=\"flex:1.3;min-width:140px\">\n                  <label style=\"display:block;font-size:12.5px;font-weight:700;color:#5C4A44;margin-bottom:6px\">Harga target / satuan (Rp)<\u002Flabel>\n                  <input type=\"number\" placeholder=\"12500\" value=\"{{ buat.harga }}\" onchange=\"{{ fBuatHarga }}\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid #E4D5CB;border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:#2B1A17\">\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:140px\">\n                  <label style=\"display:block;font-size:12.5px;font-weight:700;color:#5C4A44;margin-bottom:6px\">Tenggat <span style=\"font-weight:500;color:#9C8378\">(ops.)<\u002Fspan><\u002Flabel>\n                  <input type=\"date\" value=\"{{ buat.deadline }}\" onchange=\"{{ fBuatDeadline }}\" style=\"width:100%;box-sizing:border-box;padding:10px 13px;border:1.5px solid #E4D5CB;border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:#2B1A17\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ buatErrOn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px;color:#9A1B1F;font-weight:700;margin-bottom:12px\">{{ buatErr }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <button onclick=\"{{ submitBuat }}\" style=\"background:#A93438;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit\" style-hover=\"background:#8E2A2F\">Lanjut ke Uang Muka →<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:260px;background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:24px\">\n              <h3 style=\"margin:0 0 14px;font-size:15px;font-weight:800\">Perkiraan Biaya<\u002Fh3>\n              <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #EBDDD3\"><span style=\"color:#7C6560\">Nilai total<\u002Fspan><span style=\"font-weight:700\">{{ pvTotal }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #EBDDD3\"><span style=\"color:#7C6560\">Uang muka (30%)<\u002Fspan><span style=\"font-weight:800;color:#A93438\">{{ pvDp }}<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0\"><span style=\"color:#7C6560\">Sisa pembayaran<\u002Fspan><span style=\"font-weight:700\">{{ pvSisa }}<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:14px 0 0;font-size:11.5px;color:#9C8378;line-height:1.55\">Perkiraan lokal — angka final dihitung oleh server saat permintaan dibuat.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ buatStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:560px;background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:26px\">\n            <h3 style=\"margin:0 0 4px;font-size:17px;font-weight:800\">Bayar Uang Muka<\u002Fh3>\n            <p style=\"margin:0 0 16px;font-size:13px;color:#7C6560;line-height:1.55\">Permintaan <strong>{{ draftName }}<\u002Fstrong> tersimpan sebagai <strong>Draf<\u002Fstrong>. Bayar DP <strong style=\"color:#A93438\">{{ draftDp }}<\u002Fstrong> agar tampil publik di Jelajah Pasar.<\u002Fp>\n            <div style=\"display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap\">\n              <button onclick=\"{{ pickTransfer }}\" style=\"flex:1;min-width:150px;text-align:left;background:{{ dpTransferBg }};border:2px solid {{ dpTransferB }};border-radius:12px;padding:14px;cursor:pointer;font-family:inherit\">\n                <div style=\"font-size:14px;font-weight:800;margin-bottom:2px\">Transfer Bank<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C6560\">Ke rekening koperasi desa<\u002Fdiv>\n              <\u002Fbutton>\n              <button onclick=\"{{ pickCash }}\" style=\"flex:1;min-width:150px;text-align:left;background:{{ dpCashBg }};border:2px solid {{ dpCashB }};border-radius:12px;padding:14px;cursor:pointer;font-family:inherit\">\n                <div style=\"font-size:14px;font-weight:800;margin-bottom:2px\">Tunai<\u002Fdiv>\n                <div style=\"font-size:12px;color:#7C6560\">Setor langsung di koperasi<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px;font-size:12px;color:#9C8378;line-height:1.55\">Pembayaran dilakukan di luar aplikasi. Konfirmasi di bawah setelah DP dibayar.<\u002Fp>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <button onclick=\"{{ confirmDp }}\" style=\"flex:1;min-width:170px;background:#A93438;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit\" style-hover=\"background:#8E2A2F\">Konfirmasi DP Terbayar<\u002Fbutton>\n              <button onclick=\"{{ saveDraft }}\" style=\"background:#fff;color:#A93438;border:1.5px solid #E5C4C0;border-radius:10px;padding:13px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#FBF1F0\">Nanti saja<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ scrTitip }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Titip Komoditas\" style=\"max-width:560px;margin:0 auto;padding:28px 20px 64px\">\n        <h2 style=\"margin:0 0 4px;font-size:22px;font-weight:800\">Titipkan Komoditas<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:13.5px;color:#7C6560\">Pajang hasil panenmu di etalase koperasi — pembeli memesan langsung.<\u002Fp>\n        <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:24px\">\n          <div style=\"margin-bottom:12px\">\n            <label style=\"display:block;font-size:12.5px;font-weight:700;color:#5C4A44;margin-bottom:6px\">Nama komoditas<\u002Flabel>\n            <input type=\"text\" placeholder=\"cth. Madu Hutan Asli\" value=\"{{ titip.item }}\" onchange=\"{{ fTitipItem }}\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid #E4D5CB;border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:#2B1A17\">\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap\">\n            <div style=\"flex:1;min-width:110px\">\n              <label style=\"display:block;font-size:12.5px;font-weight:700;color:#5C4A44;margin-bottom:6px\">Stok tersedia<\u002Flabel>\n              <input type=\"number\" placeholder=\"100\" value=\"{{ titip.qty }}\" onchange=\"{{ fTitipQty }}\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid #E4D5CB;border-radius:10p uto;padding:28px 20px 64px\">\n        <h2 style=\"margin:0 0 4px;font-size:22px;font-weight:800\">Aktivitasku<\u002Fh2>\n        <p style=\"margin:0 0 20px;font-size:13.5px;color:#7C6560\">Riwayat dan status semua aksimu di Bursa Desa.<\u002Fp>\n\n        <sc-if value=\"{{ isBuyer }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:22px;margin-bottom:16px\">\n            <h3 style=\"margin:0 0 14px;font-size:15.5px;font-weight:800\">Permintaanku<\u002Fh3>\n            <sc-if value=\"{{ hasMyDemands }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ myDemands }}\" as=\"d\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #F0E4DC;border-radius:12px;padding:12px 15px\">\n                    <div onclick=\"{{ d.open }}\" style=\"flex:1;min-width:170px;cursor:pointer\">\n                      <div style=\"font-size:13.5px;font-weight:700\">{{ d.item_name }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#7C6560\">{{ d.qtyLine }} · DP {{ d.dpStatusShort }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:{{ d.bBg }};color:{{ d.bFg }}\">{{ d.bLabel }}<\u002Fspan>\n                    <sc-if value=\"{{ d.canCancel }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button onclick=\"{{ d.cancel }}\" style=\"background:#fff;color:#9A1B1F;border:1.5px solid #EFC7C4;border-radius:9px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#FBE7E5\">Batalkan<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noMyDemands }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:13px;color:#7C6560\">Belum ada permintaan. <span onclick=\"{{ ctaBuat }}\" style=\"color:#A93438;font-weight:700;cursor:pointer\">Buat sekarang →<\u002Fspan><\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid #EBDDD3;border-radius:16px;padding:22px;margin-bottom:16px\">\n            <h3 style=\"margin:0 0 14px;font-size:15.5px;font-weight:800\">Pesananku<\u002Fh3>\n            <sc-if value=\"{{ hasMyOrders }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ myOrders }}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #F0E4DC;border-radius:12px;padding:12px 15px\">\n                    <div style=\"flex:1;min-width:170px\">\n                      <div style=\"font-size:13.5px;font-weight:700\">{{ o.item }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#7C6560\">{{ o.line }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:{{ o.bBg }};color:{{ o.bFg }}\">{{ o.bLabel }}<\u002Fspan>\n                    <sc-if value=\"{{ o.canVerify }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button onclick=\"{{ o.verify }}\" style=\"background:#1D7A46;color:#fff;border:none;border-radius:9px;padding:7px 12px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#156137\">Konfirmasi Diterima<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ o.canCancel }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button onclick=\"{{ o.cancel }}\" style=\"b atus: 'CONFIRMED' }\n    ],\n    orders: [\n      { id: 'o1', owner: 'budi', listingId: 'l2', item: 'Madu Hutan Asli', qty: 12, satuan: 'botol', harga: 55000, status: 'CONFIRMED' }\n    ],\n    txns: [\n      { id: 't1', kind: 'demand', item: 'Gula Aren Cetak', pihak: 'Siti Aminah → Toko Manis Jaya', gross: 6300000, pay: 'SETTLED' },\n      { id: 't2', kind: 'demand', item: 'Beras Medium IR64', pihak: 'Wati Suharti → Budi Santoso', gross: 1500000, pay: 'PAID' },\n      { id: 't3', kind: 'supply', item: 'Madu Hutan Asli', pihak: 'Karyo → Budi Santoso', gross: 660000, pay: 'UNPAID' },\n      { id: 't4', kind: 'supply', item: 'Beras Organik Mentik Wangi', pihak: 'Wati Suharti → CV Sehat Pangan', gross: 1440000, pay: 'PAID' },\n      { id: 't5', kind: 'demand', item: 'Kopi Robusta Petik Merah', pihak: 'Wati Suharti → Budi Santoso', gross: 2600000, pay: 'UNPAID' }\n    ],\n    kyc: [\n      { id: 'k1', name: 'Slamet Riyadi', nik: '3402**********12', doc: 'KTP + surat keterangan desa' },\n      { id: 'k2', name: 'Siti Aminah', nik: '3402**********87', doc: 'KTP' }\n    ],\n    modal: null, modErr: '', pledgeQty: '', pledgePrice: '', orderQty: '',\n    pending: null,\n    tab: 'masuk', loginEmail: '', loginPass: '', authErr: '',\n    reg: { name: '', email: '', pass: '', phone: '', role: 'WARGA', koperasi: 'KDMP Desa Sukamaju', anggota: '' },\n    buat: { item: '', satuan: 'kg', qty: '', harga: '', deadline: '' }, buatStep: 1, buatDraft: null, buatErr: '', dpMethod: 'TRANSFER',\n    titip: { item: '', satuan: 'kg', qty: '', harga: '' }, titipErr: '',\n    toast: ''\n  };\n\n  get cu() {\n    const s = this.state;\n    if (s.user) return s.user;\n    if (!s.loggedOut) {\n      const r = this.props.peranAwal;\n      if (r && r !== 'TAMU') {\n        const key = r === 'BUYER' ? 'budi' : r === 'WARGA' ? 'wati' : 'darto';\n        return this.USERS[key];\n      }\n    }\n    return null;\n  }\n\n  fmtN(n) { return (n || 0).toLocaleString('id-ID'); }\n  fmtRp(n) { return 'Rp' + Math.round(n || 0).toLocaleString('id-ID'); }\n  fmtTgl(iso) { if (!iso) return '—'; return new Date(iso + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); }\n  hari(iso) {\n    if (!iso) return 'tanpa tenggat';\n    const diff = Math.ceil((new Date(iso + 'T00:00:00') - new Date()) / 864e5);\n    if (diff < 0) return 'lewat tenggat';\n    if (diff === 0) return 'hari ini';\n    return diff + ' hari lagi';\n  }\n\n  toastMsg(msg) {\n    clearTimeout(this._toastT);\n    this.setState({ toast: msg });\n    this._toastT = setTimeout(() => this.setState({ toast: '' }), 3000);\n  }\n\n  nav(screen, extra) { this.setState(Object.assign({ screen, modal: null, modErr: '', authErr: '' }, extra || {})); }\n\n  decD(d) {\n    const total_price = d.total * d.harga;\n    const pct = d.total ? Math.min(100, Math.round(d.fulfilled / d.total * 100)) : 0;\n    const b = this.DEMAND_BADGE[d.status] || this.DEMAND_BADGE.OPEN;\n    return Object.assign({}, d, {\n      pct,\n      qtyLine: this.fmtN(d.fulfilled) + ' / ' + this.fmtN(d.total) + ' ' + d.satuan + ' tersanggupi',\n      hargaTxt: this.fmtRp(d.harga),\n      hargaNum: String(d.harga),\n      totalTxt: this.fmtRp(total_price),\n      dpTxt: this.fmtRp(total_price * 0.3),\n      sisaTxt: this.fmtRp(total_price * 0.7),\n      tglTxt: this.fmtTgl(d.deadline),\n      hariTxt: this.hari(d.deadline),\n      sisaKuotaTxt: this.fmtN(Math.max(0, d.total - d.fulfilled)) + ' ' + d.satuan,\n      bLabel: b[0], bBg: b[1], bFg: b[2],\n      dpPaid: d.dp === 'PAID',\n      dpStatusShort: d.dp === 'PAID' ? 'terbayar' : 'belum dibayar',\n      dpStatusLabel: d.dp === 'PAID' ? 'Terbayar (' + (d.method === 'CASH' ? 'Tunai' : 'Transfer') + ')' : 'Belum dibayar',\n      pledgeCount: d.pledges.length,\n      open: () => this.nav('demand', { demandId: d.id })\n    });\n  }\n\n  decL(l) {\n    const stok = Math.max(0, l.avail - l.sold);\n    const st = stok === 0 ? 'SOLD_OUT' : l.status;\n    const b = this.LISTING_BADGE[st] || this.LISTING_BADGE.ACTIVE;\n    return Object.assign({}, l, {\n      stok,\n      stokLine: 'Stok tersedia: ' + this.fmtN(stok) + ' ' + l.satuan,\n      stokTxt: this.fmtN(stok) + ' ' + l.satuan,\n      terjualTxt: this.fmtN(l.sold) + ' ' + l.satuan,\n      hargaTxt: this.fmtRp(l.harga),\n      tglTxt: this.fmtTgl(l.tanggal),\n      bLabel: b[0], bBg: b[1], bFg: b[2],\n      open: () => this.nav('listing', { listingId: l.id })\n    });\n  }\n\n  login(user) {\n    this.setState({ user, loggedOut: false, authErr: '', loginEmail: '', loginPass: '' }, () => this.resume(user));\n  }\n\n  resume(user) {\n    const p = this.state.pending;\n    if (!p) {\n      this.nav(user.role === 'ADMIN_KOPERASI' ? 'dash' : 'pasar');\n      this.toastMsg('Selamat datang, ' + user.name + '!');\n      return;\n    }\n    this.setState({ pending: null });\n    if (p.type === 'pledge') {\n      if (user.role === 'WARGA') { this.nav('demand', { demandId: p.id, modal: 'pledge', pledgeQty: '', pledgePrice: '' }); }\n      else { this.nav('demand', { demandId: p.id }); this.toastMsg('Menyanggupi khusus peran Warga Desa.'); }\n    } else if (p.type === 'order') {\n      if (user.role === 'BUYER') { this.nav('listing', { listingId: p.id, modal: 'order', orderQty: '' }); }\n      else { this.nav('listing', { listingId: p.id }); this.toastMsg('Memesan khusus peran Pembeli.'); }\n    } else if (p.type === 'buat') {\n      if (user.role === 'BUYER') { this.nav('buat', { buatStep: 1 }); }\n      else { this.nav('pasar'); this.toastMsg('Membuat permintaan khusus peran Pembeli.'); }\n    } else {\n      this.nav('pasar');\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const u = this.cu;\n    const varian = this.props.varianBeranda ?? 'kartu';\n    const heroOn = (this.props.tampilkanHero ?? true) && true;\n\n    // ---- pasar list ----\n    const FILTERS = { AKTIF: ['OPEN', 'PARTIAL'], OPEN: ['OPEN'], PARTIAL: ['PARTIAL'], SEMUA: null };\n    const allow = FILTER ({ authErr: 'Nama dan email wajib diisi.' }); return; }\n    if ((r.pass || '').length < 6) { this.setState({ authErr: 'Kata sandi minimal 6 karakter.' }); return; }\n    const user = { id: 'baru', name: r.name, role: r.role, ver: 'PENDING' };\n    this.toastMsg('Akun dibuat! Status verifikasi: Menunggu.');\n    this.login(user);\n  }\n\n  submitPledge() {\n    const s = this.state;\n    const d = s.demands.find(x => x.id === s.demandId);\n    const qty = parseFloat(s.pledgeQty) || 0;\n    if (qty <= 0) { this.setState({ modErr: 'Isi jumlah yang disanggupi.' }); return; }\n    const sisa = d.total - d.fulfilled;\n    if (qty > sisa) { this.setState({ modErr: 'Melebihi sisa kebutuhan (' + this.fmtN(sisa) + ' ' + d.satuan + '). Server akan menolak permintaan ini (409).' }); return; }\n    const u = this.cu;\n    const nf = d.fulfilled + qty;\n    this.setState(prev => ({\n      demands: prev.demands.map(x => x.id === d.id ? Object.assign({}, x, {\n        fulfilled: nf,\n        status: nf >= x.total ? 'FULFILLED' : 'PARTIAL',\n        pledges: x.pledges.concat([{ name: u.name, q: qty, d: 0, st: 'PLEDGED' }])\n      }) : x),\n      pledges: prev.pledges.concat([{ id: 'p' + Date.now(), owner: u.id, demandId: d.id, item: d.item_name, qty, satuan: d.satuan, status: 'PLEDGED' }]),\n      modal: null, modErr: ''\n    }));\n    this.toastMsg('Kesanggupan terkirim — terima kasih sudah bergotong royong!');\n  }\n\n  submitOrder() {\n    const s = this.state;\n    const l = s.listings.find(x => x.id === s.listingId);\n    const qty = parseFloat(s.orderQty) || 0;\n    if (qty <= 0) { this.setState({ modErr: 'Isi jumlah pesanan.' }); return; }\n    const stok = l.avail - l.sold;\n    if (qty > stok) { this.setState({ modErr: 'Melebihi stok tersedia (' + this.fmtN(stok) + ' ' + l.satuan + '). Server akan menolak pesanan ini (409).' }); return; }\n    const u = this.cu;\n    this.setState(prev => ({\n      listings: prev.listings.map(x => x.id === l.id ? Object.assign({}, x, { sold: x.sold + qty }) : x),\n      orders: prev.orders.concat([{ id: 'o' + Date.now(), owner: u.id, listingId: l.id, item: l.item_name, qty, satuan: l.satuan, harga: l.harga, status: 'BARU' }]),\n      modal: null, modErr: ''\n    }));\n    this.toastMsg('Pesanan dibuat! Harga dikunci di ' + this.fmtRp(l.harga) + '/' + l.satuan + '.');\n  }\n\n  submitBuat() {\n    const b = this.state.buat;\n    const qty = parseFloat(b.qty) || 0, harga = parseFloat(b.harga) || 0;\n    if (!b.item.trim()) { this.setState({ buatErr: 'Nama komoditas wajib diisi.' }); return; }\n    if (qty <= 0 || harga <= 0) { this.setState({ buatErr: 'Jumlah dan harga target harus lebih dari 0.' }); return; }\n    const u = this.cu;\n    const id = 'd' + Date.now();\n    this.setState(prev => ({\n      demands: prev.demands.concat([{\n        id, owner: u.id, item_name: b.item.trim(), satuan: b.satuan.trim() || 'kg',\n        total: qty, fulfilled: 0, harga, deadline: b.deadline || null,\n        status: 'DRAFT', dp: 'UNPAID', method: null, pledges: [], kandidat: []\n      }]),\n      buatDraft: id, buatStep: 2, buatErr: ''\n    }));\n  }\n\n  confirmDp() {\n    const s = this.state;\n    this.setState(prev => ({\n      demands: prev.demands.map(x => x.id === prev.buatDraft ? Object.assign({}, x, { status: 'OPEN', dp: 'PAID', method: prev.dpMethod }) : x),\n      buat: { item: '', satuan: 'kg', qty: '', harga: '', deadline: '' }, buatStep: 1\n    }), () => {\n      this.nav('demand', { demandId: s.buatDraft });\n      this.toastMsg('DP dikonfirmasi — permintaanmu kini tampil publik!');\n    });\n  }\n\n  submitTitip() {\n    const t = this.state.titip;\n    const qty = parseFloat(t.qty) || 0, harga = parseFloat(t.harga) || 0;\n    if (!t.item.trim()) { this.setState({ titipErr: 'Nama komoditas wajib diisi.' }); return; }\n    if (qty <= 0 || harga <= 0) { this.setState({ titipErr: 'Stok dan harga harus lebih dari 0.' }); return; }\n    const u = this.cu;\n    this.setState(prev => ({\n      listings: prev.listings.concat([{\n        id: 'l' + Date.now(), owner: u.id, seller: u.name, item_name: t.item.trim(),\n        satuan: t.satuan.trim() || 'kg', avail: qty, sold: 0, harga, status: 'ACTIVE',\n        tanggal: new Date().toISOString().slice(0, 10)\n      }]),\n      titip: { item: '', satuan: 'kg', qty: '', harga: '' }, titipErr: ''\n    }), () => {\n      this.nav('etalase');\n      this.toastMsg('Komoditasmu kini tampil di etalase koperasi!');\n    });\n  }\n\n  cancelDemand(id) {\n    this.setState(prev => ({ demands: prev.demands.map(x => x.id === id ? Object.assign({}, x, { status: 'CANCELLED' }) : x) }));\n    this.toastMsg('Permintaan dibatalkan. Sesuai ketentuan, DP hangus (FORFEITED).');\n  }\n\n  cancelPledge(id) {\n    this.setState(prev => {\n      const p = prev.pledges.find(x => x.id === id);\n      return {\n        pledges: prev.pledges.map(x => x.id === id ? Object.assign({}, x, { status: 'CANCELLED' }) : x),\n        demands: p ? prev.demands.map(d => d.id === p.demandId ? Object.assign({}, d, {\n          fulfilled: Math.max(0, d.fulfilled - p.qty),\n          pledges: d.pledges.filter(pl => !(pl.name === (this.cu ? this.cu.name : '') && pl.q === p.qty && pl.st === 'PLEDGED'))\n        }) : d) : prev.demands\n      };\n    });\n    this.toastMsg('Kesanggupan dibatalkan.');\n  }\n\n  setOrder(id, status, msg) {\n    this.setState(prev => ({ orders: prev.orders.map(x => x.id === id ? Object.assign({}, x, { status }) : x) }));\n    this.toastMsg(msg);\n  }\n\n  verifyOrder(id) {\n    this.setState(prev => {\n      const o = prev.orders.find(x => x.id === id);\n      return {\n        orders: prev.orders.map(x => x.id === id ? Object.assign({}, x, { status: 'DONE' }) : x),\n        txns: o ? prev.txns.concat([{ id: 't' + Date.now(), kind: 'supply', item: o.item, pihak: '— → ' + (this.cu ? this.cu.name : ''), gross: o.qty * o.harga, pay: 'UNPAID' }]) : prev.txns\n      };\n    });\n    this.toastMsg('Serah-terima tercatat. Komisi koperasi 5% masu
