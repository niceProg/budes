# Stack produksi Budes di VM (Docker). Ref DB = remote KDMP (read-only); App DB = container.
# Deploy:  docker compose --env-file /home/yumna/budes-config/prod.env up -d --build
name: budes

services:
  app-db:
    image: postgres:18.4
    restart: unless-stopped
    # Set timezone server ke WIB (GUC diterapkan tiap start, tak bergantung initdb).
    command: ["postgres", "-c", "timezone=Asia/Jakarta", "-c", "log_timezone=Asia/Jakarta"]
    environment:
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
      POSTGRES_USER: budes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib di prod.env}
      POSTGRES_DB: budes_app
    volumes:
      - app_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budes -d budes_app"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      TZ: Asia/Jakarta
      PORT: "8080"
      APP_DATABASE_URL: postgres://budes:${POSTGRES_PASSWORD}@app-db:5432/budes_app?sslmode=disable
      REF_DATABASE_URL: ${REF_DATABASE_URL:?wajib di prod.env}
      JWT_SECRET: ${JWT_SECRET:?wajib di prod.env}
      WA_BASE_URL: ${WA_BASE_URL:-}
      WA_SESSION: ${WA_SESSION:-default}
      WA_API_KEY: ${WA_API_KEY:-}
      WA_GROUP_CHAT_ID: ${WA_GROUP_CHAT_ID:-120363428225078710@g.us}
      # Gateway pembayaran Mayar (sandbox default) + URL frontend utk redirect
      MAYAR_BASE_URL: ${MAYAR_BASE_URL:-https://api.mayar.club/hl/v1}
      MAYAR_API_KEY: ${MAYAR_API_KEY:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://budes.yum-dev.com}
      UPLOAD_DIR: /app/uploads
    expose:
      - "8080"
    volumes:
      - budes_uploads:/app/uploads

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      PORT: "8080"
      # Base API publik (browser) dari prod.env; base internal (SSR) default ke service api.
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      NUXT_API_BASE_SERVER: ${NUXT_API_BASE_SERVER:-http://api:8080}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_db_data:
  caddy_data:
  caddy_config:
  budes_uploads:
